name: CI

# Runs on the self-hosted runner, so it takes no secret and no write
# permission: the token is read-only and this workflow publishes nothing
# (publishing belongs to the release workflow on a version tag and the nightly
# workflow on a push to `main`, THREAT_MODEL T15, SPEC D-23). It must stay on
# `pull_request`, never `pull_request_target`, which would hand a fork's code
# a write token and the repository secrets.

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: [self-hosted, runners01]
    timeout-minutes: 30
    env:
      IMAGE: crossboard:ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Chromium runs in Playwright's official image, so the runner installs no
      # browser and no system library (and needs no root). The tag's version
      # must equal the Playwright version in pnpm-lock.yaml, because the test
      # client and `run-server` must match; bump the tag and digest together
      # with that dependency.
      PW_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      PW_VERSION: 1.64.1
      PW_CONTAINER: crossboard-pw-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      # pnpm falls back to a .pnpm-store inside the checkout when the default
      # store is on another filesystem, and prettier then checks it.
      - name: Install
        env:
          npm_config_store_dir: ${{ runner.temp }}/pnpm-store
        run: pnpm install --frozen-lockfile

      - name: Gate
        run: pnpm gate

      - name: Build the Docker image
        run: docker build -t "$IMAGE" .

      # The browser runs in the Playwright container on the host network, so it
      # reaches the app container and the fake GitHub on the runner's loopback
      # interface exactly as a host browser would. The container gets no Docker
      # socket, no secret and no extra privilege, and runs as the image's
      # unprivileged user. `run-server` binds a port the OS picks (`--port 0`),
      # because runs that overlap on this host share its loopback interface; the
      # step reads the bound endpoint from the line `run-server` logs once it is
      # listening and hands it to the next steps. A container that exits first
      # fails the job.
      - name: Start the Playwright browser server
        run: |
          docker run --detach --name "$PW_CONTAINER" --network host --init \
            --user pwuser --workdir /home/pwuser "$PW_IMAGE" \
            npx --yes "playwright@$PW_VERSION" run-server \
            --host 127.0.0.1 --port 0
          deadline=$((SECONDS + 120))
          while true; do
            endpoint="$(docker logs "$PW_CONTAINER" 2>&1 | sed -n 's|^Listening on \(ws://127\.0\.0\.1:[0-9][0-9]*/\)$|\1|p' | head -n 1)"
            [[ -n "$endpoint" ]] && break
            if [[ "$(docker inspect --format '{{.State.Running}}' "$PW_CONTAINER")" != true ]] || (( SECONDS > deadline )); then
              docker logs "$PW_CONTAINER" || true
              echo "::error::the Playwright browser server did not come up"
              exit 1
            fi
            sleep 2
          done
          echo "PW_WS_ENDPOINT=$endpoint" >> "$GITHUB_ENV"

      # Runs the built image against a fake GitHub on the runner's loopback
      # interface (the container shares the host network); nothing here talks
      # to the real GitHub. The tests drive the browser server started above.
      - name: End-to-end tests
        env:
          CROSSBOARD_E2E_IMAGE: ${{ env.IMAGE }}
          PW_TEST_CONNECT_WS_ENDPOINT: ${{ env.PW_WS_ENDPOINT }}
        run: pnpm --filter ./e2e test:e2e

      - name: Remove the Playwright browser container
        if: always()
        run: docker rm --force "$PW_CONTAINER"

      - name: Remove the Docker image
        if: always()
        run: docker image rm --force "$IMAGE"
