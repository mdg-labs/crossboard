name: Feature request
description: Propose a new capability or an enhancement to an existing one.
title: "feat: "
labels:
  - feat
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you're trying to solve before jumping to a
        solution — it makes triage and design easier.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case this would solve.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How you imagine this working, if you have an idea.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
